# =============================================================================
# Trading Risk Engine - Apache Kafka KRaft Broker Configuration
# =============================================================================
# Production configuration optimized for high-throughput, low-latency financial
# tick streaming in Google Cloud Platform VPC (Subnet: sb-ingestion).
# =============================================================================

# KRaft Cluster Identity & Roles
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@localhost:9093

# Network & Listeners Configuration
listeners=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
advertised.listeners=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
controller.listener.names=CONTROLLER
listener.security.protocol.map=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT

# Threading & Socket Buffers (Optimized for High Tick Ingestion)
num.network.threads=8
num.io.threads=8
socket.send.buffer.bytes=1048576
socket.receive.buffer.bytes=1048576
socket.request.max.bytes=104857600

# Storage & Partition Defaults
log.dirs=/var/lib/kafka/data
num.partitions=6
default.replication.factor=1
min.insync.replicas=1

# Topic Governance & Safety (Strict financial data loss prevention)
auto.create.topics.enable=false
unclean.leader.election.enable=false

# Compression & Record Sizes (lz4 offers highest throughput with lowest CPU penalty)
compression.type=lz4
message.max.bytes=1048576
replica.fetch.max.bytes=1048576

# Retention Policies (24-hour operational sliding buffer / 10GB per partition)
log.cleanup.policy=delete
log.retention.hours=24
log.retention.bytes=10737418240
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000

# Metadata & Consumer Offsets
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
group.initial.rebalance.delay.ms=0
