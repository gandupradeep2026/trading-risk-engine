# Great Expectations Configuration for Trading Risk Engine
# Google Cloud Platform (GCP) Cloud Composer & Databricks Lakehouse

config_version: 3.0

datasources:
  delta_lake_silver:
    module_name: great_expectations.datasource
    class_name: Datasource
    execution_engine:
      module_name: great_expectations.execution_engine
      class_name: SparkDFExecutionEngine
    data_connectors:
      silver_delta_connector:
        module_name: great_expectations.datasource.data_connector
        class_name: InferredAssetFilePathDataConnector
        base_directory: ${GCS_SILVER_BUCKET_URL}/delta/silver
        default_regex:
          pattern: (.*)\/year=(\d{4})\/month=(\d{2})\/day=(\d{2})\/(.*)\.parquet
          group_names:
            - data_asset_name
            - year
            - month
            - day
            - file_name

  delta_lake_gold:
    module_name: great_expectations.datasource
    class_name: Datasource
    execution_engine:
      module_name: great_expectations.execution_engine
      class_name: SparkDFExecutionEngine
    data_connectors:
      gold_delta_connector:
        module_name: great_expectations.datasource.data_connector
        class_name: InferredAssetFilePathDataConnector
        base_directory: ${GCS_GOLD_BUCKET_URL}/delta/gold
        default_regex:
          pattern: (.*)\/year=(\d{4})\/month=(\d{2})\/day=(\d{2})\/(.*)\.parquet
          group_names:
            - data_asset_name
            - year
            - month
            - day
            - file_name

  local_parquet_datasource:
    module_name: great_expectations.datasource
    class_name: Datasource
    execution_engine:
      module_name: great_expectations.execution_engine
      class_name: PandasExecutionEngine
    data_connectors:
      runtime_data_connector:
        module_name: great_expectations.datasource.data_connector
        class_name: RuntimeDataConnector
        batch_identifiers:
          - pipeline_stage
          - execution_date

config_variables_file_path: uncommitted/config_variables.yml

plugins_directory: plugins/

stores:
  expectations_store:
    class_name: ExpectationsStore
    store_backend:
      class_name: TupleFilesystemStoreBackend
      base_directory: expectations/

  validations_store:
    class_name: ValidationsStore
    store_backend:
      class_name: TupleFilesystemStoreBackend
      base_directory: uncommitted/validations/

  evaluation_parameter_store:
    class_name: EvaluationParameterStore

  checkpoint_store:
    class_name: CheckpointStore
    store_backend:
      class_name: TupleFilesystemStoreBackend
      base_directory: checkpoints/

expectations_store_name: expectations_store
validations_store_name: validations_store
evaluation_parameter_store_name: evaluation_parameter_store
checkpoint_store_name: checkpoint_store

data_docs_sites:
  local_site:
    class_name: SiteBuilder
    show_how_to_buttons: false
    store_backend:
      class_name: TupleFilesystemStoreBackend
      base_directory: uncommitted/data_docs/local_site/
    site_index_builder:
      class_name: DefaultSiteIndexBuilder

  gcs_site:
    class_name: SiteBuilder
    show_how_to_buttons: false
    store_backend:
      class_name: TupleGCSStoreBackend
      project: ${GCP_PROJECT_ID}
      bucket: ${GCS_GOLD_BUCKET_NAME}
      prefix: great_expectations/data_docs/
    site_index_builder:
      class_name: DefaultSiteIndexBuilder

anonymous_usage_statistics:
  enabled: false
