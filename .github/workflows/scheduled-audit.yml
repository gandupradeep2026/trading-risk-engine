name: Scheduled Security & Dependency Audit

on:
  schedule:
    # Run every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  PYTHONUNBUFFERED: "1"
  CI: "true"

jobs:
  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set Up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Audit Scanners
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit

      - name: Audit Development Dependencies
        run: |
          pip-audit -r requirements-dev.txt || echo "Audit completed with warnings"

      - name: Scan Codebase with Bandit
        run: |
          bandit -r batch/ dwh/ ingestion/ orchestration/ streaming/ ci/ -c pyproject.toml --severity-level medium
